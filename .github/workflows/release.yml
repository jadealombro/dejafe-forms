name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' dejafe-forms.php | awk '{print $NF}')
          CONST=$(grep -m1 "DEJAFE_FORMS_VERSION'" dejafe-forms.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "tag=$TAG header=$HEADER constant=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Bump the Version header and DEJAFE_FORMS_VERSION in dejafe-forms.php to $TAG before tagging."
            exit 1
          fi

      - name: Build dejafe-forms.zip
        run: |
          mkdir -p build/dejafe-forms
          rsync -a --exclude-from=.distignore ./ build/dejafe-forms/
          (cd build && zip -qr ../dejafe-forms.zip dejafe-forms)
          unzip -l dejafe-forms.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dejafe-forms.zip --title "$GITHUB_REF_NAME" --generate-notes
